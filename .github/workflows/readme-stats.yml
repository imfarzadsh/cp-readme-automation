name: README stats (reusable)

on:
  workflow_call:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: imfarzadsh/cp-readme-automation.git
          path: .stats-tool
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats
        run: python .stats-tool/.github/scripts/update_readme_stats.py

      - name: Commit changes
        run: |
          rm -rf .stats-tool
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: update README stats [skip ci]"
            git push
          else
            echo "No changes."
          fi