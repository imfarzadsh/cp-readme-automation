name: README stats

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats-${{ github.repository }}
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout stats tool
        if: github.repository != 'imfarzadsh/cp-readme-automation'
        uses: actions/checkout@v4
        with:
          repository: imfarzadsh/cp-readme-automation
          path: .stats-tool
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats
        run: |
          if [ -d .stats-tool ]; then
            python .stats-tool/.github/scripts/update_readme_stats.py
          else
            python .github/scripts/update_readme_stats.py
          fi

      - name: Commit changes
        run: |
          rm -rf .stats-tool
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: update README stats [skip ci]"
            git push
          else
            echo "No changes."
          fi